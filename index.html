<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>LITMUS Live</title>
    <meta name="description" content="A live needle scoring how proportionate or hyperbolic broadcast speech is, sentence by sentence." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />
  </head>
  <body>
    <header class="masthead">
      <span class="ramp" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="wordmark">LITMUS</span>
      <span class="live">Live</span>
    </header>

    <main>
      <section id="gate" class="gate" hidden>
        <form id="gate-form" autocomplete="off">
          <label for="passcode">Passcode</label>
          <input id="passcode" name="passcode" type="password" required autofocus />
          <button type="submit">Enter</button>
          <p id="gate-error" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section id="meter" class="meter" hidden>
        <div id="budget-banner" class="banner" role="alert" hidden></div>

        <div class="controls">
          <button id="btn-tab" type="button">Listen to a tab</button>
          <button id="btn-mic" type="button" class="secondary">Use microphone</button>
          <button id="btn-stop" type="button" class="stop" hidden>Stop</button>
        </div>
        <p id="hint" class="hint" hidden>Pick the tab in the dialog and tick &ldquo;Share tab audio&rdquo;.</p>
        <p id="error" class="error" role="alert" hidden></p>

        <div class="now">
          <h2 class="label">Speaker now</h2>
          <p id="interim" class="interim" aria-live="off">&nbsp;</p>
        </div>

        <figure class="gauge" aria-label="P/H needle">
          <svg viewBox="0 0 200 116" role="img" aria-labelledby="gauge-value">
            <g id="arcs" fill="none" stroke-width="18"></g>
            <g id="needle" class="needle">
              <line x1="100" y1="100" x2="100" y2="22" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" />
            </g>
            <circle cx="100" cy="100" r="6" fill="var(--ink)" />
          </svg>
          <figcaption>
            <span class="end">Proportionate</span>
            <span id="gauge-value" class="value">Waiting for the first sentence</span>
            <span class="end">Hyperbolic</span>
          </figcaption>
        </figure>

        <div class="showing">
          <h2 class="label">Needle is showing</h2>
          <p id="showing" class="sentence">&nbsp;</p>
        </div>

        <aside class="hottest">
          <h2 class="label">Hottest line so far</h2>
          <div id="hottest" class="row empty"><p class="sentence">Nothing scored yet.</p></div>
        </aside>

        <ol id="list" class="list" aria-label="Scored sentences, newest first"></ol>

        <footer class="readout">
          <span id="minutes">0.0 min listened</span>
          <span id="cost">$0.000 this session</span>
          <label class="debug"><input id="debug" type="checkbox" /> Show lag</label>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
